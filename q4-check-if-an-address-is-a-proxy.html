<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Check If an Address Is a Proxy — EEZ</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Geist:wght@400;500;600;700;800&family=Geist+Mono:wght@400;500;600&display=swap" rel="stylesheet">
<style>
  *{box-sizing:border-box;}
  html,body{margin:0;background:#000;}
  :root{ --sans:'Geist',system-ui,-apple-system,'Segoe UI',sans-serif; --mono:'Geist Mono',ui-monospace,'SF Mono',Menlo,Consolas,monospace; }
  @keyframes riseIn{ from{transform:translateY(12px);opacity:0;} to{transform:translateY(0);opacity:1;} }
  @keyframes dashMove{ to{stroke-dashoffset:-24;} }
  @media (prefers-reduced-motion: reduce){ *{ animation-duration:0.001ms !important; animation-delay:0ms !important; transition-duration:0.001ms !important; } }
  button{font-family:var(--mono);}
  button:focus-visible{outline:2px solid #3fb950;outline-offset:2px;}
  .btn:hover{background:#1a1a1a !important;}
  .btn-play:hover{background:#4fce61 !important;}
  a.back{font-family:var(--mono);font-size:12px;color:#9a9a9a;text-decoration:none;}
  a.back:hover{color:#fff;}
  .row{background:#10151c;border:1px solid #232b36;border-radius:8px;padding:10px 16px;display:flex;align-items:center;justify-content:space-between;font-family:var(--mono);font-size:14.5px;}
</style>
</head>
<body>
<div style="position:fixed;inset:0;background:#000;display:flex;align-items:center;justify-content:center;overflow:hidden;font-family:var(--sans);">
<div id="stage" style="position:relative;width:1920px;height:1080px;flex:none;background-color:#000;background-image:linear-gradient(rgba(255,255,255,.045) 1px,transparent 1px),linear-gradient(90deg,rgba(255,255,255,.045) 1px,transparent 1px);background-size:42px 42px;color:#fff;transform-origin:center center;">

  <div style="position:absolute;left:0;top:0;width:1920px;height:96px;display:flex;align-items:center;justify-content:space-between;padding:0 48px;border-bottom:1px solid #1a1a1a;">
    <div style="display:flex;align-items:center;gap:18px;">
      <a class="back" href="./index.html">← Quickstarts</a>
      <div style="width:5px;height:5px;border-radius:50%;background:#2a2a2a;"></div>
      <div style="font-size:22px;font-weight:600;color:#fff;">Check If an Address Is a Proxy</div>
      <div style="font-family:var(--mono);font-size:12px;letter-spacing:0.1em;color:#e8b15e;background:transparent;border:1px solid #4a3f26;border-radius:100px;padding:4px 12px;">SPEC · NOT LIVE</div>
    </div>
    <div id="stepLabel" style="font-family:var(--mono);font-size:20px;color:#9a9a9a;letter-spacing:0.06em;">01 / 03</div>
  </div>

  <div style="position:absolute;left:48px;top:140px;width:1112px;height:712px;display:flex;flex-direction:column;justify-content:center;gap:28px;">

    <div style="font-family:var(--mono);font-size:13px;letter-spacing:0.1em;color:#6e7a89;">authorizedProxies · public mapping</div>

    <!-- table of a few addresses, one highlighted per step -->
    <div style="display:flex;flex-direction:column;gap:8px;">
      <div class="row" style="opacity:.35;"><span style="color:#5c6673;">0x91aB…c4E2</span><span style="color:#5c6673;">isProxy: false</span></div>
      <div id="hitRow" class="row" style="border-color:#3fb950;background:rgba(63,185,80,0.07);">
        <span style="color:#7ee08c;">someAddress</span>
        <span id="hitVal" style="color:#9a9a9a;">?</span>
      </div>
      <div class="row" style="opacity:.35;"><span style="color:#5c6673;">0x22Fa…9c11</span><span style="color:#5c6673;">isProxy: false</span></div>
    </div>

    <!-- expanded record, step 3 -->
    <div id="record" style="display:none;background:#050505;border:1px solid #1a1a1a;border-radius:9px;padding:18px 22px;">
      <div style="display:flex;gap:14px;">
        <div style="flex:1;background:#10151c;border:1px solid #232b36;border-radius:8px;padding:10px 14px;">
          <div style="font-family:var(--mono);font-size:12px;color:#5e9e6b;">isProxy</div>
          <div style="font-family:var(--mono);font-size:19px;color:#7ee08c;margin-top:3px;">true</div>
        </div>
        <div style="flex:1;background:#10151c;border:1px solid #232b36;border-radius:8px;padding:10px 14px;">
          <div style="font-family:var(--mono);font-size:12px;color:#a98ad0;">originalAddress</div>
          <div style="font-family:var(--mono);font-size:19px;color:#c89cf5;margin-top:3px;">0xC0ffEE…0042</div>
        </div>
        <div style="flex:1;background:#10151c;border:1px solid #232b36;border-radius:8px;padding:10px 14px;">
          <div style="font-family:var(--mono);font-size:12px;color:#7782b8;">originalRollupId</div>
          <div style="font-family:var(--mono);font-size:19px;color:#9aa4f0;margin-top:3px;">1</div>
        </div>
      </div>
    </div>

    <div id="note" style="font-size:16px;color:#7d8798;max-width:900px;"></div>
  </div>

  <div style="position:absolute;left:1208px;top:140px;width:664px;height:712px;background:#050505;border:1px solid #1a1a1a;border-radius:10px;overflow:hidden;">
    <div style="display:flex;align-items:center;gap:9px;padding:16px 22px;border-bottom:1px solid #1a1a1a;">
      <div style="width:9px;height:9px;border-radius:50%;background:#3fb950;"></div>
      <div style="font-family:var(--mono);font-size:14px;color:#9a9a9a;letter-spacing:0.02em;">IEEZ.sol · ProxyInfo</div>
    </div>
    <div id="codePanel" style="height:660px;overflow:hidden;padding:22px 26px;font-family:var(--mono);font-size:20px;line-height:36px;"></div>
  </div>

  <div style="position:absolute;left:0;top:884px;width:1920px;height:196px;border-top:1px solid #1a1a1a;display:flex;align-items:center;justify-content:space-between;padding:0 48px;gap:48px;">
    <div style="flex:1;max-width:1180px;">
      <div id="kicker" style="font-family:var(--mono);font-size:14px;letter-spacing:0.16em;color:#3fb950;margin-bottom:11px;"></div>
      <div id="caption" style="font-size:25px;line-height:1.4;color:#d8d8d8;text-wrap:pretty;"></div>
    </div>
    <div style="flex:none;display:flex;flex-direction:column;align-items:flex-end;gap:18px;">
      <div style="display:flex;align-items:center;gap:12px;">
        <button id="btnPrev" class="btn" style="font-size:16px;color:#d8d8d8;background:#141414;border:1px solid #2a2a2a;border-radius:100px;padding:12px 22px;cursor:pointer;">‹ Prev</button>
        <button id="btnPlay" class="btn-play" style="font-size:16px;font-weight:600;color:#06210c;background:#3fb950;border:1px solid #3fb950;border-radius:100px;padding:12px 28px;cursor:pointer;min-width:120px;">▶ Play</button>
        <button id="btnNext" class="btn" style="font-size:16px;color:#d8d8d8;background:#141414;border:1px solid #2a2a2a;border-radius:100px;padding:12px 22px;cursor:pointer;">Next ›</button>
      </div>
      <div id="dots" style="display:flex;align-items:center;gap:7px;"></div>
    </div>
  </div>

</div>
</div>

<script>
(function(){
  var N = 3, STEP_MS = 3000;
  var step = 0, playing = false, timer = null;

  var kickers = ["ONE PUBLIC MAPPING", "READ, DON'T GUESS", "isProxy IS THE FLAG"];
  var captions = [
    "Every proxy is recorded when it's created.",
    "Read the mapping directly — no simulation, no guessing.",
    "isProxy true means the other two fields are real."
  ];
  var notes = [
    "someAddress sits alongside every other address the manager has ever seen.",
    "One call: authorizedProxies(someAddress).",
    "true means a real proxy for that (address, rollup) pair — false means it's not."
  ];

  var codeByStep = [
    [
      "mapping(address proxy => ProxyInfo info)",
      "    public authorizedProxies;"
    ],
    [
      "(bool isProxy, address origAddr, uint64 origRid)",
      "    = eez.authorizedProxies(someAddress);"
    ],
    [
      "struct ProxyInfo {",
      "    bool isProxy;",
      "    address originalAddress;",
      "    uint64 originalRollupId;",
      "}",
      "",
      "if (isProxy) { /* real proxy for origAddr@origRid */ }"
    ]
  ];
  var hlByStep = [ [0,1], [0,1], [0,1,2,3,5] ];

  var els = { hitVal: document.getElementById('hitVal'), record: document.getElementById('record'), note: document.getElementById('note') };

  function render(){
    document.getElementById("stepLabel").textContent = String(step+1).padStart(2,"0") + " / " + String(N).padStart(2,"0");
    document.getElementById("kicker").textContent = kickers[step];
    document.getElementById("caption").textContent = captions[step];
    document.getElementById("btnPlay").textContent = playing ? "❚❚ Pause" : "▶ Play";
    els.note.textContent = notes[step];

    els.hitVal.textContent = step === 0 ? "?" : "reading…";
    els.hitVal.style.color = step === 0 ? "#9a9a9a" : "#7ee08c";
    els.record.style.display = step === 2 ? "block" : "none";
    els.record.style.animation = step === 2 ? "riseIn .4s ease both" : "";

    var code = codeByStep[step];
    var hl = hlByStep[step] || [];
    var html = "";
    for(var i=0;i<code.length;i++){
      var lit = hl.indexOf(i) !== -1;
      var t = code[i].length ? code[i] : " ";
      html += '<div style="display:flex;align-items:stretch;padding:1px 12px;'
        + (lit ? "background:rgba(63,185,80,0.10);box-shadow:inset 3px 0 0 #3fb950;" : "background:transparent;") + '">'
        + '<span style="white-space:pre;' + (lit ? "color:#eef3f8;" : "color:#7d8798;") + '">'
        + t.replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;") + '</span></div>';
    }
    document.getElementById("codePanel").innerHTML = html;

    var d = "";
    for(var j=0;j<N;j++){
      var st = j===step ? "width:30px;background:#3fb950;" : (j<step ? "width:13px;background:#3a4250;" : "width:13px;background:#222a35;");
      d += '<div style="height:6px;border-radius:3px;transition:width .2s,background .2s;'+st+'"></div>';
    }
    document.getElementById("dots").innerHTML = d;
  }

  function scaleStage(){ var s = Math.min(window.innerWidth/1920, window.innerHeight/1080); document.getElementById("stage").style.transform = "scale("+s+")"; }
  function schedule(){ clearTimeout(timer); timer = setTimeout(function(){ if(!playing) return; if(step >= N-1){ playing=false; render(); return; } step++; render(); schedule(); }, STEP_MS); }
  function togglePlay(){ if(playing){ clearTimeout(timer); playing=false; render(); return; } if(step >= N-1) step = 0; playing = true; render(); schedule(); }
  function next(){ clearTimeout(timer); playing=false; step=Math.min(N-1,step+1); render(); }
  function prev(){ clearTimeout(timer); playing=false; step=Math.max(0,step-1); render(); }

  document.getElementById("btnPrev").addEventListener("click", prev);
  document.getElementById("btnNext").addEventListener("click", next);
  document.getElementById("btnPlay").addEventListener("click", togglePlay);
  window.addEventListener("keydown", function(e){
    if(e.key==="ArrowRight"){ e.preventDefault(); next(); }
    else if(e.key==="ArrowLeft"){ e.preventDefault(); prev(); }
    else if(e.key===" "){ e.preventDefault(); togglePlay(); }
  });
  window.addEventListener("resize", scaleStage);
  scaleStage(); render();
})();
</script>
</body></html>
