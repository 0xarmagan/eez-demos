name: CI

on:
  push:
    branches: ["**"]
  pull_request:
  # Citations are the one thing here that rots with nobody touching the repo:
  # upstream adds an import, every line number below it shifts, and a pinned
  # citation quietly stops pointing at what it claims. Push-triggered CI cannot
  # catch that, so check daily. Scheduled runs execute on the default branch.
  schedule:
    - cron: "0 6 * * *"
  workflow_dispatch:

jobs:
  structure:
    name: Structure, citations, panel drift
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Structural audit
        run: bash scripts/audit.sh

      # The code panel is a fixed 662x663 column with overflow:auto, so an
      # over-long line is not destroyed — it hides behind a scrollbar nobody
      # looks for. This class shipped three times (2026-08-20, 08-23, 08-25)
      # while every other gate passed, because the checker existed and nothing
      # ran it. It runs here now.
      - name: Code panel geometry
        run: |
          npm install puppeteer --no-save
          node scripts/check-panel-geometry.cjs

      # Asserts every Solidity line in a code panel also exists in a snippet
      # that the compiler checks. Catches a panel edited into invalid Solidity.
      - name: Panel drift
        run: python3 scripts/check-panel-drift.py

      # Fetches each cited file at its pinned SHA and asserts the line and
      # symbol still match. This is the check that catches upstream drift.
      - name: Citations resolve to real source
        run: python3 scripts/verify-citations.py

      # llms.txt / llms-full.txt are generated from the pages and snippets, so a
      # content edit without a rebuild leaves agents reading stale code.
      - name: Agent-readable files are current
        run: python3 scripts/build-llms.py --check

  solidity:
    name: Snippets compile and tests pass
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install Foundry
        uses: foundry-rs/foundry-toolchain@v1
        with:
          version: nightly

      - name: forge build
        working-directory: snippets
        run: forge build

      - name: forge test
        working-directory: snippets
        run: forge test -vv
