name: CI

on:
  push:
    branches: ["**"]
  pull_request:
  # Citations are the one thing here that rots with nobody touching the repo:
  # upstream adds an import, every line number below it shifts, and a pinned
  # citation quietly stops pointing at what it claims. Push-triggered CI cannot
  # catch that, so check daily. Scheduled runs execute on the default branch.
  schedule:
    - cron: "0 6 * * *"
  workflow_dispatch:

jobs:
  structure:
    name: Structure, citations, panel drift
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Structural audit
        run: bash scripts/audit.sh

      # Asserts every Solidity line in a code panel also exists in a snippet
      # that the compiler checks. Catches a panel edited into invalid Solidity.
      - name: Panel drift
        run: python3 scripts/check-panel-drift.py

      # Fetches each cited file at its pinned SHA and asserts the line and
      # symbol still match. This is the check that catches upstream drift.
      - name: Citations resolve to real source
        run: python3 scripts/verify-citations.py

  solidity:
    name: Snippets compile and tests pass
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install Foundry
        uses: foundry-rs/foundry-toolchain@v1
        with:
          version: nightly

      - name: forge build
        working-directory: snippets
        run: forge build

      - name: forge test
        working-directory: snippets
        run: forge test -vv
