<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Why You Can't Call the Manager Directly — EEZ</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500;600&family=IBM+Plex+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
  *{box-sizing:border-box;}
  html,body{margin:0;background:#0b0f14;}
  :root{ --sans:'IBM Plex Sans',system-ui,-apple-system,'Segoe UI',sans-serif; --mono:'IBM Plex Mono',ui-monospace,'SF Mono',Menlo,Consolas,monospace; }
  @keyframes riseIn{ from{transform:translateY(12px);opacity:0;} to{transform:translateY(0);opacity:1;} }
  @keyframes dashMove{ to{stroke-dashoffset:-24;} }
  @media (prefers-reduced-motion: reduce){ *{ animation-duration:0.001ms !important; animation-delay:0ms !important; transition-duration:0.001ms !important; } }
  button{font-family:var(--mono);}
  button:focus-visible{outline:2px solid #3fb950;outline-offset:2px;}
  .btn:hover{background:#1e2630 !important;}
  .btn-play:hover{background:#4fce61 !important;}
  a.back{font-family:var(--mono);font-size:12px;color:#8b95a3;text-decoration:none;}
  a.back:hover{color:#cdd5e0;}
</style>
</head>
<body>
<div style="position:fixed;inset:0;background:#0b0f14;display:flex;align-items:center;justify-content:center;overflow:hidden;font-family:var(--sans);">
<div id="stage" style="position:relative;width:1920px;height:1080px;flex:none;background:#0b0f14;color:#e6edf3;transform-origin:center center;">

  <div style="position:absolute;left:0;top:0;width:1920px;height:96px;display:flex;align-items:center;justify-content:space-between;padding:0 48px;border-bottom:1px solid #1c232d;">
    <div style="display:flex;align-items:center;gap:18px;">
      <a class="back" href="./index.html">← Quickstarts</a>
      <div style="width:5px;height:5px;border-radius:50%;background:#2c3543;"></div>
      <div style="font-size:22px;font-weight:600;color:#e6edf3;">Why You Can't Call the Manager Directly</div>
      <div style="font-family:var(--mono);font-size:12px;letter-spacing:0.1em;color:#e8b15e;background:rgba(240,168,60,0.12);border:1px solid #463a1e;border-radius:5px;padding:4px 9px;">SPEC · NOT LIVE</div>
    </div>
    <div id="stepLabel" style="font-family:var(--mono);font-size:20px;color:#8b95a3;letter-spacing:0.06em;">01 / 03</div>
  </div>

  <div style="position:absolute;left:48px;top:140px;width:1112px;height:712px;display:flex;flex-direction:column;justify-content:center;gap:40px;">

    <div style="position:relative;height:130px;">
      <svg viewBox="0 0 1080 130" style="position:absolute;inset:0;width:1080px;height:130px;pointer-events:none;">
        <defs><marker id="ar-r" markerWidth="9" markerHeight="9" refX="6.5" refY="3" orient="auto"><path d="M0,0 L7,3 L0,6 Z" fill="#f85149"></path></marker></defs>
        <line id="lBad" x1="300" y1="65" x2="700" y2="65" stroke="#f85149" stroke-width="2.5" stroke-dasharray="6 6" marker-end="url(#ar-r)" style="opacity:0;animation:dashMove 1s linear infinite;"></line>
      </svg>
      <div style="display:flex;align-items:center;">
        <div style="width:280px;background:#1a0f10;border:1.5px solid #f85149;border-radius:9px;padding:16px 18px;">
          <div style="font-family:var(--mono);font-size:12px;letter-spacing:0.1em;color:#c76b66;">ANYONE ELSE</div>
          <div style="font-size:20px;font-weight:600;margin-top:4px;color:#ffb3af;">eez.executeCrossChainCall()</div>
        </div>
        <div style="flex:1;"></div>
        <div id="badTo" style="width:280px;background:#141b2b;border:1.5px solid #7c83ff;border-radius:9px;padding:16px 18px;opacity:.35;">
          <div style="font-family:var(--mono);font-size:12px;letter-spacing:0.1em;color:#7782b8;">EEZ MANAGER</div>
          <div id="badToText" style="font-size:20px;font-weight:600;margin-top:4px;color:#eef1ff;">?</div>
        </div>
      </div>
    </div>

    <div style="position:relative;height:130px;">
      <svg viewBox="0 0 1080 130" style="position:absolute;inset:0;width:1080px;height:130px;pointer-events:none;">
        <defs><marker id="ar-g" markerWidth="9" markerHeight="9" refX="6.5" refY="3" orient="auto"><path d="M0,0 L7,3 L0,6 Z" fill="#3fb950"></path></marker></defs>
        <line id="lGood" x1="300" y1="65" x2="700" y2="65" stroke="#3fb950" stroke-width="2.5" stroke-dasharray="6 6" marker-end="url(#ar-g)" style="opacity:0;animation:dashMove 1s linear infinite;"></line>
      </svg>
      <div style="display:flex;align-items:center;">
        <div style="width:280px;background:rgba(180,120,240,0.06);border:1.5px dashed #b478f0;border-radius:9px;padding:16px 18px;opacity:.35;" id="goodFrom">
          <div style="font-family:var(--mono);font-size:12px;letter-spacing:0.1em;color:#a98ad0;">A REAL PROXY</div>
          <div style="font-size:20px;font-weight:600;margin-top:4px;color:#f1e8ff;">fallback → executeCrossChainCall</div>
        </div>
        <div style="flex:1;"></div>
        <div id="goodTo" style="width:280px;background:rgba(63,185,80,0.07);border:1.5px solid #3fb950;border-radius:9px;padding:16px 18px;opacity:.35;">
          <div style="font-family:var(--mono);font-size:12px;letter-spacing:0.1em;color:#5e9e6b;">EEZ MANAGER</div>
          <div style="font-size:20px;font-weight:600;margin-top:4px;color:#7ee08c;">executes it</div>
        </div>
      </div>
    </div>

    <div id="note" style="font-size:16px;color:#7d8798;max-width:900px;"></div>
  </div>

  <div style="position:absolute;left:1208px;top:140px;width:664px;height:712px;background:#0d1219;border:1px solid #1c232d;border-radius:10px;overflow:hidden;">
    <div style="display:flex;align-items:center;gap:9px;padding:16px 22px;border-bottom:1px solid #1c232d;">
      <div style="width:9px;height:9px;border-radius:50%;background:#3fb950;"></div>
      <div style="font-family:var(--mono);font-size:14px;color:#8b95a3;letter-spacing:0.02em;">EEZ.sol:786</div>
    </div>
    <div id="codePanel" style="height:660px;overflow:hidden;padding:22px 26px;font-family:var(--mono);font-size:20px;line-height:36px;"></div>
  </div>

  <div style="position:absolute;left:0;top:884px;width:1920px;height:196px;border-top:1px solid #1c232d;display:flex;align-items:center;justify-content:space-between;padding:0 48px;gap:48px;">
    <div style="flex:1;max-width:1180px;">
      <div id="kicker" style="font-family:var(--mono);font-size:14px;letter-spacing:0.16em;color:#3fb950;margin-bottom:11px;"></div>
      <div id="caption" style="font-size:25px;line-height:1.4;color:#c3ccd6;text-wrap:pretty;"></div>
    </div>
    <div style="flex:none;display:flex;flex-direction:column;align-items:flex-end;gap:18px;">
      <div style="display:flex;align-items:center;gap:12px;">
        <button id="btnPrev" class="btn" style="font-size:16px;color:#c3ccd6;background:#161c25;border:1px solid #2a323d;border-radius:8px;padding:12px 20px;cursor:pointer;">‹ Prev</button>
        <button id="btnPlay" class="btn-play" style="font-size:16px;font-weight:600;color:#06210c;background:#3fb950;border:1px solid #3fb950;border-radius:8px;padding:12px 26px;cursor:pointer;min-width:120px;">▶ Play</button>
        <button id="btnNext" class="btn" style="font-size:16px;color:#c3ccd6;background:#161c25;border:1px solid #2a323d;border-radius:8px;padding:12px 20px;cursor:pointer;">Next ›</button>
      </div>
      <div id="dots" style="display:flex;align-items:center;gap:7px;"></div>
    </div>
  </div>

</div>
</div>

<script>
(function(){
  var N = 3, STEP_MS = 3000;
  var step = 0, playing = false, timer = null;

  var kickers = ["ONLY A REAL PROXY", "THE GUARD", "CHECKED EVERY CALL"];
  var captions = [
    "Anyone can try calling the manager's entry point directly.",
    "It reverts — UnauthorizedProxy(). Only a real proxy gets through.",
    "The registry check runs on every call, by design."
  ];
  var notes = [
    "",
    "",
    "The guard checks the registry every time — not a bug, the whole point of it."
  ];

  var codeByStep = [
    [
      "function executeCrossChainCall(",
      "    address sourceAddress,",
      "    bytes calldata callData",
      ") external payable returns (bytes memory) {"
    ],
    [
      "ProxyInfo storage proxyInfo =",
      "    authorizedProxies[msg.sender];",
      "",
      "if (!proxyInfo.isProxy)",
      "    revert UnauthorizedProxy();"
    ],
    [
      "ProxyInfo storage proxyInfo =",
      "    authorizedProxies[msg.sender];",
      "",
      "if (!proxyInfo.isProxy)",
      "    revert UnauthorizedProxy();",
      "",
      "// msg.sender must be a real proxy —",
      "// never the caller's own address"
    ]
  ];
  var hlByStep = [ [0,1,2,3], [0,1,3,4], [6,7] ];

  var els = {
    lBad: document.getElementById('lBad'), badTo: document.getElementById('badTo'), badToText: document.getElementById('badToText'),
    lGood: document.getElementById('lGood'), goodFrom: document.getElementById('goodFrom'), goodTo: document.getElementById('goodTo'),
    note: document.getElementById('note')
  };

  function render(){
    document.getElementById("stepLabel").textContent = String(step+1).padStart(2,"0") + " / " + String(N).padStart(2,"0");
    document.getElementById("kicker").textContent = kickers[step];
    document.getElementById("caption").textContent = captions[step];
    document.getElementById("btnPlay").textContent = playing ? "❚❚ Pause" : "▶ Play";
    els.note.textContent = notes[step];

    els.lBad.style.opacity = step >= 0 ? "1" : "0";
    els.badTo.style.opacity = step >= 1 ? "1" : ".35";
    els.badToText.textContent = step >= 1 ? "revert UnauthorizedProxy()" : "?";
    els.badToText.style.color = step >= 1 ? "#ff6b63" : "#eef1ff";

    els.lGood.style.opacity = step >= 2 ? "1" : "0";
    els.goodFrom.style.opacity = step >= 2 ? "1" : ".35";
    els.goodTo.style.opacity = step >= 2 ? "1" : ".35";

    var code = codeByStep[step];
    var hl = hlByStep[step] || [];
    var html = "";
    for(var i=0;i<code.length;i++){
      var lit = hl.indexOf(i) !== -1;
      var t = code[i].length ? code[i] : " ";
      html += '<div style="display:flex;align-items:stretch;padding:1px 12px;'
        + (lit ? "background:rgba(63,185,80,0.10);box-shadow:inset 3px 0 0 #3fb950;" : "background:transparent;") + '">'
        + '<span style="white-space:pre;' + (lit ? "color:#eef3f8;" : "color:#7d8798;") + '">'
        + t.replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;") + '</span></div>';
    }
    document.getElementById("codePanel").innerHTML = html;

    var d = "";
    for(var j=0;j<N;j++){
      var st = j===step ? "width:30px;background:#3fb950;" : (j<step ? "width:13px;background:#3a4250;" : "width:13px;background:#222a35;");
      d += '<div style="height:6px;border-radius:3px;transition:width .2s,background .2s;'+st+'"></div>';
    }
    document.getElementById("dots").innerHTML = d;
  }

  function scaleStage(){ var s = Math.min(window.innerWidth/1920, window.innerHeight/1080); document.getElementById("stage").style.transform = "scale("+s+")"; }
  function schedule(){ clearTimeout(timer); timer = setTimeout(function(){ if(!playing) return; if(step >= N-1){ playing=false; render(); return; } step++; render(); schedule(); }, STEP_MS); }
  function togglePlay(){ if(playing){ clearTimeout(timer); playing=false; render(); return; } if(step >= N-1) step = 0; playing = true; render(); schedule(); }
  function next(){ clearTimeout(timer); playing=false; step=Math.min(N-1,step+1); render(); }
  function prev(){ clearTimeout(timer); playing=false; step=Math.max(0,step-1); render(); }

  document.getElementById("btnPrev").addEventListener("click", prev);
  document.getElementById("btnNext").addEventListener("click", next);
  document.getElementById("btnPlay").addEventListener("click", togglePlay);
  window.addEventListener("keydown", function(e){
    if(e.key==="ArrowRight"){ e.preventDefault(); next(); }
    else if(e.key==="ArrowLeft"){ e.preventDefault(); prev(); }
    else if(e.key===" "){ e.preventDefault(); togglePlay(); }
  });
  window.addEventListener("resize", scaleStage);
  scaleStage(); render();
})();
</script>
</body></html>
